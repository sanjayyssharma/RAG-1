name: Daily Corpus Update Scheduler

on:
  schedule:
    # Runs at 04:30 UTC every day (which is 10:00 AM IST)
    - cron: '30 4 * * *'
  workflow_dispatch:
    # Allows manual triggering from the GitHub UI

jobs:
  update-corpus:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Orchestrator Pipeline
        run: |
          python src/update_corpus.py

      - name: Commit and push updated raw data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/ data/cleaned/
          # Only commit if there are changes
          git diff --staged --quiet || git commit -m "chore: automated weekly corpus update"
          git push
